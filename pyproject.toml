[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashkey-mcp"
version = "0.1.3"
description = "FlashKey FK-01 MCP server — AI-native USB programmer & debugger"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "mcp>=1.0,<2",
    # SSE 是默认传输方式（共享常驻服务），因此运行时依赖直接内置
    "starlette>=0.38",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# 兼容旧安装命令 `pip install flashkey-mcp[sse]`；依赖已包含在默认安装中
sse = [
    "starlette>=0.38",
    "uvicorn>=0.30",
]

[project.license]
text = "MIT"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
flashkey-mcp = "flashkey_mcp.server:main"

[tool.setuptools.package-data]
flashkey_mcp = [
    "py.typed",
    "firmware/*.hex",
    "firmware/*.json",
    "configs/*.service",
    "configs/*.timer",
    "openocd/*.cfg",
    "openocd/*.txt",
    "openocd/*.md",
    "openocd/bin/linux-x64/*",
    "openocd/bin/win-x64/*",
]
